services:
  backend:
    image: python:3.12-slim
    working_dir: /app/backend
    volumes:
      - ./backend:/app/backend
    environment:
      # Fixture provider works offline; ATTOM is a placeholder that raises
      # NotImplementedError until a license is provisioned, so no key is needed to boot.
      - PYTHONUNBUFFERED=1
    command: sh -c "pip install --quiet -r requirements.txt && python -m uvicorn app.main:app --reload --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

  frontend:
    image: node:22
    working_dir: /app/frontend
    volumes:
      - ./frontend:/app/frontend
      - frontend_node_modules:/app/frontend/node_modules
    ports:
      - "3000:5173"
    environment:
      # Vite dev-server proxy target — the backend service on the compose network.
      - VITE_API_TARGET=http://backend:8000
      # Lets Vite accept the preview's external hostname (set by the platform).
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    depends_on:
      backend:
        condition: service_healthy
    command: sh -c "npm install && npm run dev"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

volumes:
  frontend_node_modules:
